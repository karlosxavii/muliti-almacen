{% extends "base.html" %}
{% block title %}Página no encontrada · {{ APP_NAME }}{% endblock %}
{% block page_title %}Página no encontrada{% endblock %}
{% block content %}
<div class="error-page">
    <span class="error-code">404</span>
    <h2>La página o registro que buscas no existe</h2>
    <p class="muted">Verifica la dirección o vuelve al panel principal.</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">Volver</a>
</div>
{% endblock %}
